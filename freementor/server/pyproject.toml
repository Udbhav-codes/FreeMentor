[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freementor-server"
version = "0.1.0"
description = "FreeMentor backend — auth, library delivery, progress sync, purchases."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.2",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "sqlalchemy[asyncio]==2.0.36",
  "greenlet==3.1.1",
  "asyncpg==0.30.0",
  "PyJWT[crypto]==2.15.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "aiosqlite==0.20.0",
  "ruff==0.8.4",
]

# tests/ and migrations/ sit beside app/, so auto-discovery cannot guess.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
