name: Keep the database awake

# Supabase's free tier pauses a project after about a week with no database
# activity. This pings an endpoint that actually queries the database, every
# three days, so a quiet week does not take the app down.
#
# Setup (once): GitHub -> Settings -> Secrets and variables -> Actions ->
# Variables -> New repository variable:  API_URL = https://<your-cloud-run-url>
#
# Note: GitHub switches scheduled workflows off after 60 days without any
# repository activity. If the database ever sleeps, open the Actions tab and
# re-enable this workflow, or run it by hand with "Run workflow".

on:
  schedule:
    - cron: "17 4 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API (this one touches the database)
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Set the API_URL repository variable first." >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 "$API_URL/health/db"
